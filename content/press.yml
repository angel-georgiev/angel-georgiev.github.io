bios:
  - key: short
    label: { en: "Short bio · ~50 words", bg: "Кратка биография · ~50 думи" }
    en: "Angel Georgiev is a Bulgarian trainer, author and educator who helps people learn how to learn. Over 20 years he has trained more than 20,000 people in companies, schools and online. He is the author of The Green Book of Learning (2025) and AI CERTs Outstanding Trainer of the Year – Europe 2026."
    bg: "Ангел Георгиев е обучител, автор и преподавател, който помага на хората да се научат как да учат. За 20 години е обучил над 20 000 души в компании, училища и онлайн. Автор е на „Зелената книга за ученето“ (2025) и е отличен като Обучител на годината – Европа 2026 на AI CERTs."
  - key: medium
    label: { en: "Medium bio · ~150 words", bg: "Средна биография · ~150 думи" }
    en: "Angel Georgiev is a Bulgarian trainer, author and educator who helps people master the core skill of the 21st century: learning how to learn. He manages the training portfolio at ITCE, where he also teaches AI, IT service management and software development, and is a partner at the educational assessment platform SmarTest. As educational director at SoftUni he built the company's QA Engineer program, which enrolled more than 5,000 students in its first year. He founded Sindeo Academy, an online academy for Bulgarian teachers, and Znam.be, a free career-guidance platform, and hosted 85 episodes of the teachers' podcast За учителите. Over 20 years he has trained more than 20,000 people. He is the author of The Green Book of Learning (2025), a TEDx speaker, a board member of BAIT, and AI CERTs Outstanding Trainer of the Year – Europe 2026."
    bg: "Ангел Георгиев е обучител, автор и преподавател, който помага на хората да овладеят ключовото умение на 21 век — да се учат как да учат. Управлява обучителното портфолио на ITCE, където преподава изкуствен интелект, управление на ИТ услуги и софтуерна разработка, и е партньор в платформата за образователно оценяване SmarTest. Като образователен директор на СофтУни създава програмата „QA инженер“, в която през първата година се записват над 5 000 души. Основател е на академия „Синдео“ за български учители и на платформата за кариерно ориентиране Знам.бе, а като водещ на подкаста „За учителите“ записва 85 епизода. За 20 години е обучил над 20 000 души. Автор е на „Зелената книга за ученето“ (2025), лектор в TEDx, член на УС на БАИТ и Обучител на годината – Европа 2026 на AI CERTs."
  - key: long
    label: { en: "Long bio · ~300 words", bg: "Дълга биография · ~300 думи" }
    en: "Angel Georgiev is a Bulgarian trainer, author and educator. His work rests on one idea: learning is the skill that multiplies every other skill, and most people were never taught how to do it well.\n\nFor more than 20 years he has taught in classrooms, training rooms and online, and has trained more than 20,000 people. He started in sales and marketing at Sony Ericsson, Samsung and Sony, where he trained retail teams before moving into education. At SoftUni he held roles from trainer to educational director: he designed the hybrid setup that lets online students follow live classes, built the QA Engineer program that enrolled more than 5,000 students in its first year, and created the Train-the-Trainer method still used to onboard new trainers. At Musala Soft he led technical training and built a skills matrix, parts of which the acquiring company later adopted.\n\nIn education he founded Znam.be, a free career-guidance platform whose national tours reached more than 20,000 students, and Sindeo Academy, an online academy that built a community of more than 30,000 Bulgarian teachers. He hosted 85 episodes of the teachers' podcast За учителите and has designed courses for schools including Uwekind International School and the British School of Sofia.\n\nToday he manages the training portfolio at ITCE and teaches AI, IT service management and software development as a Microsoft Certified Trainer and accredited ITIL and AI CERTs trainer. He is a partner at SmarTest, a board member of BAIT and of obr.education.\n\nHe is the author of The Green Book of Learning (2025), on seven research-based principles of learning, and writes the newsletter The Paideia Method. He spoke at TEDxSerdikaSalon and has appeared more than 100 times in Bulgarian TV, radio and press. In 2026 AI CERTs named him Outstanding Trainer of the Year – Europe."
    bg: "Ангел Георгиев е обучител, автор и преподавател. Работата му стъпва на една идея: ученето е умението, което умножава всички останали, а повечето хора никога не са били учени как да го правят добре.\n\nВече над 20 години преподава в класни стаи, зали за обучения и онлайн и е обучил над 20 000 души. Започва в продажбите и маркетинга в Sony Ericsson, Samsung и Sony, където обучава търговски екипи, преди да се насочи към образованието. В СофтУни заема роли от преподавател до образователен директор: проектира хибридната система, с която онлайн студентите следят живите занятия, създава програмата „QA инженер“ с над 5 000 записани през първата година и разработва методиката за обучение на обучители, която и днес се използва при въвеждането на нови преподаватели. В „Мусала Софт“ ръководи техническите обучения и изгражда матрица на уменията, части от която по-късно са възприети от придобиващата компания.\n\nВ образованието основава Знам.бе — безплатна платформа за кариерно ориентиране, чиито национални турнета достигат до над 20 000 ученици — и академия „Синдео“, която изгражда общност от над 30 000 български учители. Водещ е на 85 епизода на подкаста „За учителите“ и е създавал курсове за училища като Международно училище „Увекинд“ и Британското училище в София.\n\nДнес управлява обучителното портфолио на ITCE и преподава изкуствен интелект, управление на ИТ услуги и софтуерна разработка като Microsoft Certified Trainer и акредитиран обучител по ITIL и AI CERTs. Партньор е в SmarTest, член на УС на БАИТ и на obr.education.\n\nАвтор е на „Зелената книга за ученето“ (2025) — за седемте научно обосновани принципа на ученето — и пише бюлетина The Paideia Method. Говорил е на TEDxSerdikaSalon и има над 100 участия в българските телевизии, радиа и преса. През 2026 г. AI CERTs го отличава като Обучител на годината – Европа."

mc_intro:
  label: { en: "Introduction for the host · ~30 seconds", bg: "Представяне за водещия · ~30 секунди" }
  en: "Our next speaker has spent twenty years teaching people how to learn — in classrooms, in companies and online. He has trained more than twenty thousand people, built training programs at SoftUni and ITCE, founded two education ventures, and wrote The Green Book of Learning. In 2026, AI CERTs named him Europe's Outstanding Trainer of the Year. Please welcome Angel Georgiev."
  bg: "Следващият ни лектор от двадесет години учи хората как да учат — в класни стаи, в компании и онлайн. Обучил е над двадесет хиляди души, създавал е обучителни програми в СофтУни и ITCE, основал е два образователни проекта и е автор на „Зелената книга за ученето“. През 2026 г. AI CERTs го отличи като Обучител на годината за Европа. Посрещнете Ангел Георгиев."

