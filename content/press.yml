bios:
  # Rewritten 13 Nov 2026 (Angel): same facts and wording as the approved bio at the top of /resume/ (resume.yml → bio.text),
  # one shorter and one longer, so organisers can pick the length they need. The former "medium" bio was removed.
  - key: shorter
    label: { en: "Shorter bio · ~60 words", bg: "По-кратко резюме · ~60 думи" }
    en: "Angel Georgiev is a trainer, consultant and author with 20 years of experience in corporate training, educational technology and schools. More than 20,000 people have taken his trainings. He created daskal.AI, the first free AI assistant for Bulgarian teachers, and wrote The Green Book of Learning (A5 books, 2025). In 2026 AI CERTs named him Trainer of the Year for Europe."
    bg: "Ангел Георгиев е обучител, консултант и автор с 20 години опит в корпоративните обучения, образователните технологии и училищата. През обученията му са минали над 20 000 души. Създал е Даскал AI, първия безплатен AI асистент за българските учители, и е автор на „Зелената книга за ученето“ (A5 books, 2025). През 2026 г. AI CERTs го отличи като Обучител на годината за Европа."
  - key: longer
    label: { en: "Longer bio · ~270 words", bg: "По-дълго резюме · ~270 думи" }
    en: "Angel Georgiev is a trainer, consultant and author with 20 years of experience in corporate training, educational technology and schools. More than 20,000 people have taken his trainings.\n\nHe started in sales and marketing at Sony Ericsson, Samsung and Sony, where he trained retail teams. At SoftUni he was a trainer and later educational director: he created the QA Engineer programme, which enrolled more than 5,000 students in its first year, designed the hybrid setup that lets online students follow live classes, and created the train-the-trainer method SoftUni still uses. At Musala Soft he led technical training and built a skills matrix, parts of which the acquiring company adopted in its global centre.\n\nHe founded the educational platform Znam.be, whose national tours reached more than 20,000 students, and Sindeo Academy, which more than 30,000 teachers joined. He created daskal.AI, the first free AI assistant for Bulgarian teachers. He hosted 85 episodes of the teachers' podcast „За учителите“ and has designed curricula for schools such as Uwekind International School and the British School of Sofia.\n\nToday he is a product manager and trainer at ITCE, where he teaches AI, IT service management and software development as a Microsoft Certified Trainer and an accredited ITIL and AI CERTs trainer. He is a partner at SmarTest and a board member of BAIT and of Education without backpacks.\n\nHe is the author of The Green Book of Learning (A5 books, 2025) and writes the newsletter The Paideia Method. He spoke at TEDxSerdikaSalon and has more than 100 TV, radio and press appearances. In 2026 AI CERTs named him Trainer of the Year for Europe."
    bg: "Ангел Георгиев е обучител, консултант и автор с 20 години опит в корпоративните обучения, образователните технологии и училищата. През обученията му са минали над 20 000 души.\n\nЗапочнал е в продажбите и маркетинга в Sony Ericsson, Samsung и Sony, където е обучавал търговски екипи. В СофтУни е бил преподавател, а после образователен директор: създал е програмата „QA инженер“, в която през първата година се записаха над 5 000 души, проектирал е хибридната система, с която онлайн студентите следят живите занятия, и е разработил методиката за обучение на обучители, която СофтУни използва и днес. В Musala Soft е ръководил техническите обучения и е изградил матрица на уменията, части от която компанията, придобила Musala Soft, внедри в своя глобален център.\n\nОсновал е образователната платформа Знам.бе, чиито национални турнета достигнаха до над 20 000 ученици, и академия „Синдео“, в която влязоха над 30 000 учители. Създал е Даскал AI, първия безплатен AI асистент за българските учители. Водил е 85 епизода на подкаста „За учителите“ и е създавал учебни програми за училища като Международно училище „Увекинд“ и Британското училище в София.\n\nДнес е продуктов мениджър и обучител в ITCE, където преподава изкуствен интелект, управление на ИТ услуги и софтуерна разработка като Microsoft Certified Trainer и акредитиран обучител по ITIL и AI CERTs. Партньор е в СмарТест и член на УС на БАИТ и на „Образование без раници“.\n\nАвтор е на „Зелената книга за ученето“ (A5 books, 2025) и пише бюлетина The Paideia Method. Говорил е на TEDxSerdikaSalon и има над 100 участия в телевизия, радио и преса. През 2026 г. AI CERTs го отличи като Обучител на годината за Европа."

mc_intro:
  label: { en: "Introduction for the host · ~30 seconds", bg: "Представяне за водещия · ~30 секунди" }
  en: "Our next speaker has spent twenty years teaching people how to learn: in classrooms, in companies and online. He has trained more than twenty thousand people, built training programs at SoftUni and ITCE, founded two education ventures, and wrote The Green Book of Learning. In 2026, AI CERTs named him Trainer of the Year for Europe. Please welcome Angel Georgiev."
  bg: "Следващият ни лектор от двадесет години учи хората как да учат: в класни стаи, в компании и онлайн. Обучил е над двадесет хиляди души, създавал е обучителни програми в СофтУни и ITCE, основал е два образователни проекта и е автор на „Зелената книга за ученето“. През 2026 г. AI CERTs го отличи като Обучител на годината за Европа. Посрещнете Ангел Георгиев."

