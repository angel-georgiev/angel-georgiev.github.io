bio:
  heading: Short bio
  note: 'For organisers and media: copy and use freely.'
  text: Angel Georgiev is a trainer, consultant and author with 20 years of experience in corporate training, educational technology and schools. More than 20,000 people have taken his trainings. At SoftUni he was educational director and created the QA Engineer programme, and at Musala Soft he led technical training. He founded the educational platform Znam.be and Sindeo Academy, which more than 30,000 teachers joined, and created daskal.AI, the first free AI assistant for Bulgarian teachers. Today he is a product manager and trainer at ITCE and a partner at SmarTest. He is the author of The Green Book of Learning (A5 books, 2025). In 2026 AI CERTs named him Trainer of the Year for Europe.
