cases:
  kicker: "From practice"
  h2: "What I have done in companies."
  items:
    - title: "Skills matrix, Musala Soft"
      meta: "2018–2021 · Head of technical training"
      ask: "All employees went through the same general training."
      problem: "People had no personal development paths, and management could not see who stood where."
      decision: "I created a skills matrix by role and linked it to trainings from the first working day."
      result: "The company that acquired Musala Soft adopted parts of the system in its global centre."
    - title: "Hybrid learning, SoftUni"
      meta: "2017–2018 · Director of Research and Development"
      ask: "SoftUni wanted online students to learn with the same quality as those in the classroom."
      problem: "Off-the-shelf platforms could not handle this scale together with live classes in the room."
      decision: "I designed our own system. We started with one pilot room and grew to ten."
      result: "More than 18 simultaneous streams. SoftUni still runs the same system today."
  labels: { ask: "The task", problem: "The real problem", decision: "Decision", result: "Result" }
  credentials: ["Microsoft Certified Trainer", "ITIL® accredited trainer", "AI CERTs trainer · Trainer of the Year, Europe 2026", "Experience with ITIL and SAFe"]

