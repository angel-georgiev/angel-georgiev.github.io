how:
  kicker: "How I work"
  h2: "The process first, then the tool."
  steps:
    - { title: "We look at the process", text: "Together with the people who do it every day, we describe how the work runs now and where time is lost." }
    - { title: "We decide what to change", text: "For each problem we choose a solution: better organisation, training or an AI tool. Often the best solution involves no technology." }
    - { title: "We train and measure", text: "The team learns the new way of working on its own real tasks, and then we check whether the change has worked." }

