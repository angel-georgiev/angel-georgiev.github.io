program:
  id: program
  kicker: "The programme"
  h2: "What we do together"
  for_whom: "For teachers of all subjects and stages, principals and school counsellors. No AI experience needed. 70% of the time is practice."
  draft_note: ""
  blocks:
    - { title: "How AI works and where it gets things wrong", text: "We compare ChatGPT, Claude and Gemini. Teachers see when AI makes things up and what to check: facts, personal data and copyright." }
    - { title: "Prompts that give a precise result", text: "We practise the “context, instruction, format” method. With it, teachers get the result they need on the first try." }
    - { title: "Lessons, materials and tests", text: "Each teacher prepares a plan, a lesson, a presentation and a test for their own subject. We also try tools for audio and video." }
    - { title: "Students and AI", text: "I show teachers how to teach students to ask AI, check the answer and use it honestly in class and at home." }

project:
  heading: "The project after the training"
  text: "At the end of the training I give the teachers a project assignment of 8 academic hours. Each teacher works on their own and sends me the project. With it, the teacher completes the training and receives the credit."
  parts:
    - "A plan for the school year following the national curriculum: goals, units and assessment"
    - "One lesson with clear goals, activities and feedback"
    - "Lesson materials created with AI: text, a presentation, audio or video and a short test"

includes:
  heading: "What's included"
  items:
    - "8 academic hours together: a full day at your school, two days of 4 hours, or live online"
    - "A project after the training: 8 academic hours of independent work"
    - "A certificate with 1 qualification credit, issued by SmarTest"
    - "Each teacher needs a laptop and a free ChatGPT, Claude or Gemini account"
  price: "€900"
  price_note: "per school · invoice from SmarTest, paid by bank transfer"

how:
