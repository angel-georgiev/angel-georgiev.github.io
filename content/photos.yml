# Photo registry: single source for every photo on the site.
# Originals live in /public/photos/. Claude Code generates responsive AVIF/WebP sizes with Astro's image pipeline.
# Never upscale. Never crop through the face. Use `focal` (x%, y%) for object-position / crop centre.
#
# RULE (Angel, 12 Nov 2026): Daniel Kolev / DK Photography photos ONLY. No other photos anywhere on the site.
# RULE: each photo appears on one page only (the résumé downloads are the exception).
# All photos: Daniel Kolev / DK Photography, Feb 2024. Angel holds full usage rights (confirmed 8 Nov 2026).

