# Analytics (Angel chose Cloudflare Web Analytics, 12 Nov 2026). Cookieless, page views only (no custom events).
# On since go-live on daskal.ai (13 Nov 2026). Empty token = off. Paste the token from Cloudflare → Web Analytics → your site → "Manage site" (the JS snippet's "token" value).
# Never loaded on /support/thanks/ (PRD §5.3: no tracking on the post-payment page).
analytics:
  cloudflare_token: "88bb90a7c961424d9c990ee3e5c034b9"   # daskal.ai (Angel, 13 Nov 2026)

domain:
  preview: "https://angel-georgiev.github.io"
  production: "https://daskal.ai"          # switch at the end of Phase 2 (see PRD §2)
  meaning: { en: "daskal means teacher", bg: "даскал означава учител" }

nav:
  # Phase 1 (BG only, at root). EN routes later under /en/.
  # Logo links to "/". Order matches PRD §4: Помощ · Училища · Компании · Резюме.
  - { key: support,   bg: "Помощ",     en: "Help",      href: "/support/" }
  - { key: schools,   bg: "Училища",   en: "Schools",   href: "/schools/" }
  - { key: companies, bg: "Компании",  en: "Companies", href: "/companies/" }
  - { key: resume,    bg: "Резюме",    en: "Résumé",    href: "/resume/" }   # /cv/ redirects here
  - { key: daskal,  bg: "Даскал AI",        en: "daskal.AI",       href: "/daskal/", phase: 2 }

ui:
  lang_switch: { en: "Български", bg: "English" }
  theme_light: { en: "Light", bg: "Светла" }
  theme_dark:  { en: "Dark",  bg: "Тъмна" }
  copy:        { en: "Copy",  bg: "Копирайте" }
  copied:      { en: "Copied", bg: "Копирано" }
  download:    { en: "Download", bg: "Изтеглете" }
  in_bulgarian: { en: "in Bulgarian", bg: "на български" }
  last_updated: { en: "Last updated", bg: "Последна актуализация" }
  skip_link:   { en: "Skip to content", bg: "Към съдържанието" }
  soon:        { en: "Soon", bg: "Скоро" }
  # Phase 3 (DRAFT, 13 Nov 2026): one-time language suggestion bar, shown only when the browser language does not match the page.
  # Keyed by the language of the page it appears on: `bg` is shown on Bulgarian pages (pointing to English), `en` on English pages.
  lang_suggest: { en: "Тази страница е достъпна и на български.", bg: "This page is also available in English." }
  lang_suggest_go: { en: "Към българската версия →", bg: "Read it in English →" }
  close:       { en: "Close", bg: "Затвори" }   # disabled Stripe CTA label (PRD §5.3, confirmed 12 Nov 2026)

footer:
  line: { en: "Training, consulting and speaking:", bg: "Обучения, консултации и лекции:" }
  rights: { en: "© Angel Georgiev", bg: "© Ангел Георгиев" }
  # Link labels in the footer (confirmed by Angel 12 Nov 2026). URLs come from `links` above.
  links:
    - { key: linkedin, bg: "LinkedIn" }
    - { key: substack, bg: "The Paideia Method" }

# Key numbers. Wording is fixed: always "trained", never "transformed". Never show a combined total.
numbers:
  - { value: "20,000+", value_bg: "20 000+", en: "people trained over 20 years", bg: "обучени души за 20 години" }
  - { value: "20,000+", value_bg: "20 000+", en: "students assessed on Znam.be career tours", bg: "ученици с кариерна диагностика по турнетата на Знам.бе" }
  - { value: "85",      value_bg: "85",      en: "podcast episodes hosted", bg: "епизода на подкаста „За учителите“" }
  - { value: "100+",    value_bg: "100+",    en: "TV, radio and press appearances", bg: "участия в телевизия, радио и преса" }

