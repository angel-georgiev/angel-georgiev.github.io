faq:
  heading: "Често задавани въпроси"
  items:
    - q: "Само за ученици ли е книгата?"
      a: "Не. Написах я за възрастни, които учат покрай работата и семейството. Принципите работят на всяка възраст: за студенти, професионалисти и учители."
    - q: "Нужна ли ми е специална подготовка?"
      a: "Не. Книгата обяснява идеите от неврологията и когнитивната наука на ясен език, с примери от практиката."
    - q: "Откъде мога да купя книгата?"
      a: "От тази страница, с безплатна доставка в България, или от книжарниците в страната."
    - q: "Колко време отнема доставката?"
      a: "Изпращам книгата до 24 часа след поръчката. Доставката в България отнема 3–5 работни дни."
    - q: "Има ли дигитална версия?"
      a: "Засега книгата излиза само на хартия. Четенето на хартия е част от ученето."
    - q: "Мога ли да върна книгата?"
      a: "Да. Ако книгата не ви хареса, върнете я до 14 дни след получаването и ще ви възстановя цялата сума."

