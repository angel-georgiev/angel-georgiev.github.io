about:
  heading: "За какво е тази книга"
  text: "AI променя работата ни всяка година. Който умее да учи, усвоява всяко следващо умение по-бързо. Заобиколени сме от информация, но малцина от нас са учили как се учи. Книгата превръща откритията на когнитивната наука, неврологията и психологията на ученето в практически стъпки."
  for_whom:
    heading: "Книгата е за вас, ако:"
    items:
      - "сте професионалист и се преквалифицирате в нова област;"
      - "сте студент и търсите по-ефективни методи за учене;"
      - "сте родител и искате да помогнете на детето си;"
      - "сте учител и търсите подходи с доказан ефект."

parts:
  heading: "Седемте части на книгата"
  items:
    - title: "Нагласа"
      quote: { text: "Всички хора искат да учат. Потребността от учене е една от основните човешки потребности.", author: "Стивън Кови" }
      text: "Откъде идва потребността от познание и как да изградите мотивация за учене. Защо губим естественото си любопитство и как да си го върнем, така че ученето да ви носи удоволствие."
    - title: "Метод"
      quote: { text: "Обучението трябва да бъде този процес, който помага на всеки да намери своята уникалност.", author: "Лео Бускалия" }
      text: "Кога и как да учите най-ефективно: условията за учене, саморегулацията и справянето с отлагането. Историята като отправна точка и ученето чрез разказ."
    - title: "Форма"
      quote: { text: "Ключът към по-доброто образование е по-доброто преподаване, а ключът към по-доброто преподаване е установяването на това кой може да преподава и кой – не.", author: "Джонатан Алтър" }
      text: "Формите на обучение, от взаимното учене до активното и адаптивното обучение. Как да изберете подхода, който пасва на целите и начина ви на живот."
    - title: "Запомняне и практика"
      quote: { text: "Голямата трудност в обучението е да извлечеш опит от идеите.", author: "Джордж Сантаяна" }
      text: "Техники, с които знанието остава трайно: интервалното повторение, обяснението на другиго и методът „гуменото пате“. Как да приложите наученото на практика."
    - title: "Проверка"
      quote: { text: "Училището е работилница, в която се формира мисълта на подрастващото поколение, и трябва да го държите много здраво, ако не искате да изпуснете бъдещето от ръцете си.", author: "Анри Барбюс" }
      text: "Формиращото оценяване и тестовете, практиката на извличане и справянето с блокажи, когато трябва да покажете какво знаете. Как да оценявате напредъка си."
    - title: "Памет"
      quote: { text: "Нищо така не укрепва от старания и нищо така не отслабва от нехайство, както паметта.", author: "Квинтилиан" }
      text: "Как работи мозъкът: видовете памет, работната памет и когнитивното натоварване. Техники и упражнения за запаметяване, които можете да приложите веднага."
    - title: "Учене през целия живот"
      quote: { text: "Тайната на вечната младост е да се учи всеки ден нещо ново.", author: "Солон" }
      text: "Принципите на андрагогиката и хютагогиката. Как да превърнете ученето в навик за цял живот и какво ви носи то в личен и професионален план."
  note: "Книгата съдържа библиография с над 50 научни изследвания, речник на термините и десетки практически упражнения към всеки принцип."

