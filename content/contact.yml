meta:
  title: "Покани за лекции, модериране, обучения и интервюта | Ангел Георгиев"
  description: "Поканете Ангел Георгиев като лектор, модератор или обучител, или за интервю. Отговаря до 2 работни дни."

hero:
  h1: "Поканете ме на събитие, обучение или интервю."
  intro: "От 20 години обучавам хора, говоря пред публика и водя дискусии. Напишете ми какво подготвяте и до 2 работни дни ще ви отговоря дали и как мога да участвам."

cards:
  - key: talk
    title: "Лекция или панел"
    text: "Лекция, основно изказване или участие в панел. Теми, по които говоря:"
    topics: true
    after: "Търсите друга тема в тези области? Пишете ми."
    button: "Поканете ме като лектор →"
    subject: "Покана за лекция: [събитие]"
    body: |
      Здравейте, Ангел,

      Бихме искали да ви поканим да говорите на [събитие], организирано от [организация].

      Кога: [дата и час]
      Къде: [град и място / онлайн]
      Формат: [лекция / основно изказване / панел], около [продължителност] минути
      Тема: [тема или „по ваше предложение“]
      Публика: [кои са], около [брой] души
      Език: [български / английски]

      Какво бихме искали публиката да отнесе: [едно-две изречения]

      Поздрави,
      [име, длъжност, телефон]
  - key: moderate
    title: "Модериране и водене"
    text: "Водя панел, дискусия или цяло събитие: представям участниците, задавам въпросите и следя времето."
    button: "Поканете ме като модератор →"
    subject: "Покана за модератор: [събитие]"
    body: |
      Здравейте, Ангел,

      Бихме искали да ви поканим да [модерирате панел / водите събитието] [събитие], организирано от [организация].

      Кога: [дата и час]
      Къде: [град и място / онлайн]
      Тема на панела или събитието: [тема]
      Участници: [брой и кои са, ако вече знаете]
      Продължителност: [минути / часове]
      Публика: [кои са], около [брой] души
      Език: [български / английски]

      Поздрави,
      [име, длъжност, телефон]
  - key: training
    title: "Обучение за вашия екип"
    text: "Обучение, подготвено за вашите хора: учители, преподаватели или служители. Присъствено или онлайн. Пример как работя е обучението за училища."
    link: { text: "Вижте обучението за училища →", href: "/schools/" }
    button: "Поискайте обучение →"
    subject: "Запитване за обучение: [организация]"
    body: |
      Здравейте, Ангел,

      Търсим обучение за [кои са участниците] в [организация].

      Какво искаме да умеят след обучението: [едно-две изречения]
      Колко души: [брой]
      Опит с AI в момента: [начинаещи / използват понякога / използват всеки ден]
      Формат: [присъствено в … / онлайн]
      Подходящи дати: [период]
      Продължителност: [часове или дни, ако знаете]
      Език: [български / английски]

      Поздрави,
      [име, длъжност, телефон]
  - key: interview
    title: "Интервю"
    text: "Интервю за телевизия, радио, подкаст или печатно издание, по темите от лекциите или по актуален въпрос за AI и образованието."
    button: "Поканете ме за интервю →"
    subject: "Покана за интервю: [медия]"
    body: |
      Здравейте, Ангел,

      Бихме искали да ви поканим за интервю в [предаване / издание] на [медия].

      Тема: [тема]
      Кога: [дата и час] (краен срок: [ако има])
      Формат: [на живо / запис], [в студио / онлайн / по телефона]
      Продължителност: [минути]

      Поздрави,
      [име, длъжност, телефон]

