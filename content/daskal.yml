hero:
  eyebrow: "Даскал AI · 2025 → днес"
  h1: "Даскал AI се завръща. Директно във вашия AI асистент."   # Angel, 13 Nov 2026
  sub: "През март 2025 г. пуснах Даскал AI като първия безплатен AI асистент за българските учители. Новата версия подготвя годишни разпределения, уроци, контролни и дейности по учебните програми на МОН и отговаря на въпроси по ЗПУО и наредбите. Инсталирате я безплатно в Claude, ChatGPT, Gemini, Grok, DeepSeek или BgGPT."
  cta: { text: "Инсталиране във вашия AI ↓", small: "Безплатно, работи и с безплатен акаунт", href: "#install" }

story:
  heading: "Какво е Даскал AI"
  facts:
    - "Започна с името Даскал GPT в края на 2024 г. като безплатен инструмент за българските учители. На 17 март 2025 г. го пуснах за всички."   # Angel, 13 Nov 2026
    - "Учителите го използваха, за да подготвят часа си: идеи, план на урока, задачи и оценяване."
    - "За него получих личната награда на b2b Media 2025 в категория „AI в образованието и научната сфера“."
  why:
    heading: "Защо се завръща"
    text: "През последните шест месеца получих много запитвания за Даскал AI. Затова той се завръща безплатно и с всичките си функции, направо в AI асистента, който вече използвате. Новата версия познава 112-те учебни програми за I–XII клас и пълните текстове на 38 закона и наредби, актуални към 12 ноември 2026 г."

install:
  id: install
  heading: "Инсталиране във вашия AI"
  intro: "Изтеглете daskal.zip и го качете в асистента, който използвате. Разархивирайте го само ако стъпките за вашия асистент го изискват."
  note: "Проверих стъпките през ноември 2026 г. Платформите сменят менютата си. Ако бутонът се казва другояче, търсете Plugins, Skills или Upload."
  download_button: "Изтеглете daskal.zip"
  repo_link: "Файловете в GitHub →"
  tabs:
    - key: claude
      label: "Claude"
      availability: "Плъгин · работи с безплатен акаунт"
      steps:
        - "Отворете claude.ai или приложението за компютър."
        - "В страничното меню отворете Plugins. В по-старите версии пътят е Customize → Plugins."
        - "Натиснете Add → Upload plugin и изберете daskal.zip."
        - "В нов разговор напишете /. В списъка трябва да има daskal."
      notes:
        - "Плъгинът се записва в акаунта ви и работи и в мобилното приложение на Claude."
        - "За автоматични обновявания на стъпка 3 изберете Add → Add marketplace, въведете angel-georgiev/daskal.ai, добавете daskal и включете Sync automatically."
        - "Ако Claude не вижда плъгина, отворете Settings → Capabilities и включете Code execution and file creation (в новия изглед: Create and edit files)."
    - key: chatgpt
      label: "ChatGPT"
      availability: "Плъгин · работи с безплатен акаунт"
      steps:
        - "Отворете chatgpt.com на компютър."
        - "Отворете страницата Plugins от страничното меню."
        - "Натиснете Add до полето за търсене и изберете Upload plugin archive."
        - "Изберете daskal.zip. ChatGPT проверява архива, преди да добави плъгина."
    - key: gemini
      label: "Gemini"
      availability: "Умение (Skill) · работи с безплатен акаунт, само от компютър"
      steps:
        - "Разархивирайте daskal.zip. В Windows: десен бутон → Extract All. На Mac: двоен клик."
        - "Отворете gemini.google.com."
        - "В страничното меню натиснете Customize. Ако не го виждате, натиснете първо More."
        - "Горе изберете Skills, после Create → Upload."
        - "Изберете SKILL.md и натиснете Open."
        - "Добавете всички файлове от папката references/. Файловете от scripts/ не са задължителни."
        - "Натиснете Upload, прегледайте умението и натиснете Create."
    - key: grok
      label: "Grok"
      availability: "Прикачен архив · работи с безплатен акаунт"
      steps:
        - "Отворете нов разговор в grok.com."
        - "Прикачете daskal.zip с кламерчето."
        - "Напишете „Действай като даскал“ и задачата си."
      notes:
        - "Grok не пази прикачения файл между разговорите. Прикачвайте го във всеки нов разговор."
    - key: other
      label: "DeepSeek и други"
      availability: "Прикачени файлове · за асистенти без плъгини и умения"
      steps:
        - "Разархивирайте daskal.zip."
        - "В нов разговор прикачете SKILL.md, references/tematichna-karta.md и references/osnova.md."
        - "Ако питате за конкретен закон или наредба, прикачете и съответния zakon-….txt."
        - "Напишете „Следвай инструкциите в SKILL.md“ и задачата си."
    - key: bggpt
      label: "BgGPT"
      availability: "Три прикачени файла · работи с безплатен акаунт"
      steps:
        - "Разархивирайте daskal.zip."
        - "Прикачете SKILL.md, references/tematichna-karta.md и references/osnova.md."
        - "Напишете задачата си."
      notes:
        - "Трите файла стигат за уроци, разпределения, тестове, дейности и повечето нормативни въпроси. Когато е нужен точен член от закон, асистентът ви казва кой zakon-….txt да прикачите в следващото съобщение."
    - key: claude-code
      label: "Claude Code"
      availability: "За AI агенти · две команди"
      copy_blocks:
        - "claude plugin marketplace add angel-georgiev/daskal.ai"
        - "claude plugin install daskal@daskal-ai"

usage:
  heading: "Как да работите с Даскал AI"
  intro: "Отворете нов разговор и напишете задачата, например „Направи ми урок за Освобождението за 4 клас“. Можете да започнете и с „Действай като даскал“."
  tips:
    - { title: "Кратка заявка стига.", text: "Ако не посочите клас или брой часове, Даскал AI избира разумна стойност и я пише в първото изречение, за да я поправите." }
    - { title: "Опишете се веднъж.", text: "Даскал AI не помни предишните разговори. Запишете предмета, класовете, учебниците и часовете си в личните инструкции на асистента или в инструкциите на проект. Даскал AI ви предлага готов текст за това." }
    - { title: "Проверете, преди да използвате.", text: "Даскал AI посочва програмата и члена, на които се основава. По ЗПУО (чл. 219) учителят избира методите, затова последната дума е ваша." }
  disclaimer: "Даскал AI е помощник, а не юридическа консултация. При важни решения сверявайте с текста в „Държавен вестник“."

support:
  heading: "Искате Даскал AI да работи за вашия предмет?"
  text: "За един учебен час ще настроим Даскал AI за вашия предмет и класове и ще помогна с каквото още ви трябва. След срещата получавате „План в 1 страница“, а ако срещата не ви е помогнала, връщам парите. Инсталирането е описано изцяло тук и не изисква платена помощ."
  button: "Поискайте моята помощ →"
  href: "/support/"

