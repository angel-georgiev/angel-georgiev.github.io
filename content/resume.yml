bio:
  heading: Кратко резюме
  note: 'За организатори и медии: копирайте и използвайте свободно.'
  text: Ангел Георгиев е обучител, консултант и автор с 20 години опит в корпоративните обучения, образователните технологии и училищата. През обученията му са минали над 20 000 души. В СофтУни е бил образователен
    директор и е създал програмата „QA инженер“, а в Musala Soft е ръководил техническите обучения. Основал е образователната платформа Знам.бе и академия „Синдео“, в която влязоха над 30 000 учители, и
    е създал Даскал AI, първия безплатен AI асистент за българските учители. Днес е продуктов мениджър и обучител в ITCE и партньор в СмарТест. Автор е на „Зелената книга за ученето“ (Локус, 2025). През
    2026 г. AI CERTs го отличи като Обучител на годината за Европа.
  copy_button: Копирайте текста
  copied: Копирано
