meta:
  title: { en: "CV — Angel Georgiev", bg: "CV | Ангел Георгиев" }
  description:
    en: "Trainer, author and educator with 20 years in corporate training, edtech and schools."
    bg: "Обучител, автор и преподавател с 20 години опит в корпоративните обучения, образователните технологии и училищата."

header:
  photo: portrait-light   # id from content/photos.yml — square crop, head and shoulders
  name: { en: "Angel Georgiev", bg: "Ангел Георгиев" }
  role: { en: "Trainer · Consultant · Author", bg: "Обучител · Консултант · Автор" }
  summary:
    en: "I design and deliver learning that works — for companies, schools and individual learners. Over 20 years I have trained more than 20,000 people, built training programs and edtech products, and written a book on how we learn."
    bg: "Обучавам и консултирам училища, компании и отделни хора. За 20 години съм обучил над 20 000 души, изградил съм обучителни програми в СофтУни и Musala Soft, основал съм две образователни организации и съм написал книга за това как учим."

