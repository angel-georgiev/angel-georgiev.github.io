work:
  heading: { en: "Selected work", bg: "Избрани проекти" }
  items:
    - id: softuni-qa
      title: { en: "QA Engineer program, SoftUni", bg: "Програма „QA инженер“, СофтУни" }
      years: "2021–2023"
      role: { en: "Educational Director", bg: "Образователен директор" }
      # Case-study format: the ask → the real problem → the decision → the result (all facts from Angel's CV)
      ask: { en: "SoftUni needed a new program to strengthen its market position.", bg: "СофтУни търсеше нова програма, която да укрепи позициите ѝ на пазара." }
      problem: { en: "Companies were short of QA engineers, and no provider was training them; academic-only curricula would not have fixed that.", bg: "Компаниите търсеха QA инженери, а никой не ги обучаваше. Академична програма нямаше да реши проблема." }
      decision: { en: "Designed the curriculum together with industry companies and field experts over an eight-month cycle; led a team of 20+ trainers and taught 100+ hours myself.", bg: "За осем месеца разработихме програмата заедно с компании и експерти от индустрията. Ръководих екип от над 20 преподаватели и преподавах над 100 часа." }
      result: { en: "SoftUni's first new program in five years; 5,000+ enrollments in the first year.", bg: "Първата нова програма на СофтУни от пет години. През първата година се записаха над 5 000 души." }
    - id: softuni-hybrid
      title: { en: "Hybrid learning setup, SoftUni", bg: "Хибридно обучение, СофтУни" }
      years: "2017–2018"
      role: { en: "Director of Research and Development", bg: "Директор „Изследвания и развитие“" }
      ask: { en: "SoftUni wanted online students to get the same learning experience as students in the room.", bg: "СофтУни искаше онлайн студентите да учат със същото качество като тези в залата." }
      problem: { en: "No existing learning platform could handle that scale together with live, in-room teaching.", bg: "Готовите платформи не поемаха този мащаб заедно с живите занятия в залата." }
      decision: { en: "Designed a custom setup instead of buying one, and scaled it lean: one pilot room first, then 10 rooms.", bg: "Проектирах собствена система. Започнахме с една пилотна зала и стигнахме до десет." }
      result: { en: "18+ concurrent streams; SoftUni still runs on the same core setup.", bg: "Над 18 едновременни потока. СофтУни и днес работи със същата система." }
      open_item: "CV claims 10,000+ students daily today — Angel to confirm before adding."
    - id: sindeo
      title: { en: "Sindeo Academy", bg: "Академия „Синдео“" }
      years: "2022–2026"
      role: { en: "Founder", bg: "Основател" }
      text: { en: "An online academy for new and practising teachers in Bulgaria. A community of 30,000+ teachers; 8,000 took the AI in Education course; 69,000+ hours of professional development.", bg: "Основах онлайн академия за нови и практикуващи учители. В общността ѝ влязоха над 30 000 учители, 8 000 от тях преминаха курса за AI в образованието, а общо учителите натрупаха над 69 000 часа обучение." }
    - id: daskal-ai
      title: { en: "Daskal AI", bg: "Даскал AI" }
      years: "2025"
      role: { en: "Initiator and developer", bg: "Инициатор и разработчик" }
      text: { en: "A free AI assistant for Bulgarian teachers, launched in March 2025. Retired once general AI tools could do the same job — the method now lives on as a build-it-yourself guide.", bg: "През март 2025 г. пуснах безплатен AI асистент за българските учители. Спрях го, когато общите AI инструменти започнаха да вършат същото, и сега споделям метода като умение, което всеки може да инсталира." }
      href: "/daskal/"
    - id: znambe
      title: { en: "Znam.be", bg: "Знам.бе" }
      years: "2019–"
      role: { en: "Founder", bg: "Основател" }
      text: { en: "A free career-guidance platform for students and teachers. Two national tours reached 20,000+ students with career assessments; 85-episode podcast for teachers. Now run as an NGO.", bg: "Създадох безплатна платформа за кариерно ориентиране. С две национални турнета направихме кариерна диагностика на над 20 000 ученици, а с подкаста „За учителите“ записахме 85 епизода. Днес Знам.бе работи като НПО." }
  more:
    label: { en: "Also", bg: "Още" }
    items:
      - { en: "Curriculum and program design for schools, including Uwekind International School, the Prof. Ivan Apostolov school complex (Аз-буки) and the British School of Sofia.", bg: "Създавах учебни програми и курсове за училища, сред които Международно училище „Увекинд“, училищният комплекс „Проф. Иван Апостолов“ („Аз-буки“) и Британското училище в София." }
      - { en: "Skills matrix and personalised development paths at Musala Soft; elements later adopted by the acquiring company's global excellence centre.", bg: "Изградих матрица на уменията и лични пътеки за развитие в Musala Soft. Компанията, която придоби Musala, внедри части от тях в своя глобален център." }
      - { en: "Train-the-Trainer methodology at SoftUni, still used to onboard new trainers.", bg: "Създадох методиката за обучение на обучители в СофтУни. С нея СофтУни и днес въвежда новите си преподаватели." }

