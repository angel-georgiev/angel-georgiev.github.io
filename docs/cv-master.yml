      since: "2025-07"
      text: { en: "Own the catalogue of technical trainings (Microsoft, AWS, AI CERTs, ServiceNow, ITIL), lead presales for large training projects, and deliver training in ITSM, AI, software development and project management.", bg: "Отговарям за каталога с технически обучения (Microsoft, AWS, AI CERTs, ServiceNow, ITIL), водя предпродажбите при големи обучителни проекти и преподавам ITSM, изкуствен интелект, софтуерна разработка и управление на проекти." }
    - org: "SmarTest"
